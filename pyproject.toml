[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ai-check"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "packaging>=26.3",
    "rich>=15.0.0",
]

[tool.setuptools]
py-modules = ["checker", "gitdiff", "model"]
